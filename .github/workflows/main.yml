name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Create project files
        run: |
          mkdir -p proj
          cd proj
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          minecraft_version=1.21.11
          loader_version=0.19.3
          fabric_version=0.139.5+1.21.11

          mod_version=1.0.0
          maven_group=com.autoleave
          archives_base_name=autoleave
          EOF
          mkdir -p "$(dirname settings.gradle)"
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'autoleave'
          EOF
          mkdir -p "$(dirname build.gradle)"
          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF
          mkdir -p "$(dirname src/main/resources/fabric.mod.json)"
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "autoleave",
            "version": "${version}",
            "name": "AutoLeave",
            "description": "Автоматически выходит с сервера, если рядом появился другой игрок. Вкл/выкл одной кнопкой.",
            "authors": ["you"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.autoleave.AutoLeaveClient"]
            },
            "depends": {
              "fabricloader": ">=0.18.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF
          mkdir -p "$(dirname src/main/resources/assets/autoleave/lang/en_us.json)"
          cat > src/main/resources/assets/autoleave/lang/en_us.json <<'EOF'
          {
            "key.autoleave.toggle": "Toggle AutoLeave"
          }
          EOF
          mkdir -p "$(dirname src/main/resources/assets/autoleave/lang/ru_ru.json)"
          cat > src/main/resources/assets/autoleave/lang/ru_ru.json <<'EOF'
          {
            "key.autoleave.toggle": "Вкл/выкл AutoLeave"
          }
          EOF
          mkdir -p "$(dirname src/main/java/com/autoleave/AutoLeaveConfig.java)"
          cat > src/main/java/com/autoleave/AutoLeaveConfig.java <<'EOF'
          package com.autoleave;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.IOException;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.List;

          /**
           * Настройки лежат в config/autoleave.json
           *  radius               - дистанция в блоках, при которой срабатывает выход
           *  ignore               - ники, которых мод игнорирует (друзья, альты, NPC)
           *  arrivalGraceSeconds  - после захода в мир/телепорта столько секунд неподвижные игроки
           *                         (то есть NPC на спавне) не считаются угрозой, пока не пошевелятся
           *
           * Включённость мода в конфиг НЕ сохраняется: после каждого захода он выключен.
           */
          public class AutoLeaveConfig {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static final Path FILE = FabricLoader.getInstance().getConfigDir().resolve("autoleave.json");

              public double radius = 48.0;
              public int arrivalGraceSeconds = 10;
              public boolean sound = true; // сигнал при срабатывании (false = без звука)
              public boolean forceSound = true;   // играть сигнал, даже если общая громкость в игре на нуле
              public double alarmVolume = 1.0;    // громкость на время сигнала (0.1 - 1.0)
              public List<String> ignore = new ArrayList<>();

              public static AutoLeaveConfig load() {
                  if (Files.exists(FILE)) {
                      try {
                          String json = Files.readString(FILE, StandardCharsets.UTF_8);
                          AutoLeaveConfig cfg = GSON.fromJson(json, AutoLeaveConfig.class);
                          if (cfg != null) {
                              if (cfg.ignore == null) cfg.ignore = new ArrayList<>();
                              if (cfg.radius <= 0) cfg.radius = 48.0;
                              if (cfg.arrivalGraceSeconds < 0) cfg.arrivalGraceSeconds = 10;
                              if (cfg.alarmVolume < 0.1 || cfg.alarmVolume > 1.0) cfg.alarmVolume = 1.0;
                              cfg.save();
                              return cfg;
                          }
                      } catch (Exception e) {
                          AutoLeaveClient.LOGGER.warn("Не удалось прочитать конфиг, использую значения по умолчанию", e);
                      }
                  }
                  AutoLeaveConfig cfg = new AutoLeaveConfig();
                  cfg.save();
                  return cfg;
              }

              public void save() {
                  try {
                      Files.writeString(FILE, GSON.toJson(this), StandardCharsets.UTF_8);
                  } catch (IOException e) {
                      AutoLeaveClient.LOGGER.warn("Не удалось сохранить конфиг", e);
                  }
              }
          }
          EOF
          mkdir -p "$(dirname src/main/java/com/autoleave/AutoLeaveClient.java)"
          cat > src/main/java/com/autoleave/AutoLeaveClient.java <<'EOF'
          package com.autoleave;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.resources.sounds.SimpleSoundInstance;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.client.multiplayer.ClientLevel;
          import net.minecraft.client.player.AbstractClientPlayer;
          import net.minecraft.network.chat.Component;
          import org.lwjgl.glfw.GLFW;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.UUID;

          public class AutoLeaveClient implements ClientModInitializer {
              public static final Logger LOGGER = LoggerFactory.getLogger("autoleave");

              private static AutoLeaveConfig config;
              private static KeyMapping toggleKey;

              /** Каждый запуск игры начинается с ВЫКЛ. Включается кнопкой, на фермерской точке. */
              private static boolean enabled = false;

              /** После выхода сигнал проигрывается ещё раз уже в меню, на случай если игра оборвала первый. */
              private static boolean alarmPending = false;

              /** Общая громкость временно поднята на время сигнала; потом возвращается как была. */
              private static boolean volumeBoosted = false;
              private static double originalMaster = 1.0;
              private static long restoreVolumeAt = 0;

              private static long tick = 0;
              private static long graceUntil = 0;
              private static ClientLevel lastLevel = null;
              private static boolean hasLastPos = false;
              private static double lastX, lastY, lastZ;

              private static final Map<UUID, Track> tracked = new HashMap<>();

              private static class Track {
                  double x, y, z;
                  boolean moved;
                  boolean arrival; // впервые замечен сразу после захода/телепорта
              }

              @Override
              public void onInitializeClient() {
                  config = AutoLeaveConfig.load();

                  toggleKey = KeyBindingHelper.registerKeyBinding(new KeyMapping(
                          "key.autoleave.toggle",
                          InputConstants.Type.KEYSYM,
                          GLFW.GLFW_KEY_K,
                          KeyMapping.Category.MISC
                  ));

                  ClientTickEvents.END_CLIENT_TICK.register(AutoLeaveClient::onTick);
                  LOGGER.info("AutoLeave загружен, radius={}, ignore={}", config.radius, config.ignore);
              }

              private static void onTick(Minecraft mc) {
                  tick++;

                  if (volumeBoosted && tick >= restoreVolumeAt) {
                      volumeBoosted = false;
                      try {
                          mc.options.getSoundSourceOptionInstance(SoundSource.MASTER).set(originalMaster);
                      } catch (Exception e) {
                          LOGGER.warn("Не удалось вернуть громкость", e);
                      }
                  }

                  while (toggleKey.consumeClick()) {
                      enabled = !enabled;
                      tracked.clear();
                      if (mc.player != null) {
                          mc.player.displayClientMessage(
                                  Component.literal("AutoLeave: " + (enabled ? "ВКЛ (радиус " + (int) config.radius + ")" : "ВЫКЛ")),
                                  true
                          );
                      }
                  }

                  if (mc.player == null || mc.level == null || mc.getConnection() == null) {
                      if (alarmPending) {
                          alarmPending = false;
                          playAlarm(mc);
                      }
                      lastLevel = null;
                      hasLastPos = false;
                      tracked.clear();
                      return;
                  }

                  long graceTicks = Math.max(0, config.arrivalGraceSeconds) * 20L;

                  // Зашли в новый мир / сменился мир: заново начинаем "период прибытия"
                  if (mc.level != lastLevel) {
                      lastLevel = mc.level;
                      tracked.clear();
                      graceUntil = tick + graceTicks;
                      hasLastPos = false;
                  }

                  // Сами резко переместились (/spawn, /home, тп): тоже период прибытия
                  double px = mc.player.getX();
                  double py = mc.player.getY();
                  double pz = mc.player.getZ();
                  if (hasLastPos) {
                      double dx = px - lastX, dy = py - lastY, dz = pz - lastZ;
                      if (dx * dx + dy * dy + dz * dz > 100.0) {
                          tracked.clear();
                          graceUntil = tick + graceTicks;
                      }
                  }
                  lastX = px;
                  lastY = py;
                  lastZ = pz;
                  hasLastPos = true;

                  if (!enabled) return;

                  UUID selfId = mc.player.getUUID();
                  String selfName = norm(mc.player.getScoreboardName());
                  Set<UUID> seen = new HashSet<>();

                  for (AbstractClientPlayer other : mc.level.players()) {
                      if (other == mc.player) continue;

                      UUID id = other.getUUID();

                      // Никогда не реагируем на себя, даже если сервер показывает рядом копию нашего персонажа
                      if (id.equals(selfId)) continue;

                      String name = other.getName().getString();
                      String profileName = other.getScoreboardName();
                      if (norm(name).equals(selfName) || norm(profileName).equals(selfName)) continue;

                      // Только настоящие игроки из таба
                      if (mc.getConnection().getPlayerInfo(id) == null) continue;

                      // UUID версии 2 используют плагины NPC (Citizens и подобные), у игроков 3 или 4
                      if (id.version() == 2) continue;

                      if (isIgnored(name) || isIgnored(profileName)) continue;

                      seen.add(id);

                      Track t = tracked.get(id);
                      if (t == null) {
                          t = new Track();
                          t.x = other.getX();
                          t.y = other.getY();
                          t.z = other.getZ();
                          t.arrival = tick <= graceUntil;
                          tracked.put(id, t);
                      } else if (!t.moved) {
                          double dx = other.getX() - t.x;
                          double dy = other.getY() - t.y;
                          double dz = other.getZ() - t.z;
                          if (dx * dx + dy * dy + dz * dz > 0.0025) t.moved = true;
                      }

                      // Неподвижный игрок, который был на месте сразу при заходе/телепорте = NPC на спавне
                      if (t.arrival && !t.moved) continue;

                      float dist = mc.player.distanceTo(other);
                      if (dist <= config.radius) {
                          leave(mc, name, profileName, id, dist);
                          return;
                      }
                  }

                  tracked.keySet().retainAll(seen);
              }

              private static void playAlarm(Minecraft mc) {
                  try {
                      if (config.forceSound) {
                          var master = mc.options.getSoundSourceOptionInstance(SoundSource.MASTER);
                          if (!volumeBoosted) {
                              originalMaster = master.get();
                              volumeBoosted = true;
                          }
                          if (master.get() < config.alarmVolume) {
                              master.set(config.alarmVolume);
                          }
                          restoreVolumeAt = tick + 100; // ~5 секунд
                      }
                      mc.getSoundManager().play(SimpleSoundInstance.forUI(SoundEvents.ENDER_DRAGON_GROWL, 1.0F, 1.0F));
                      mc.getSoundManager().play(SimpleSoundInstance.forUI(SoundEvents.WITHER_SPAWN, 1.5F, 1.0F));
                  } catch (Exception e) {
                      LOGGER.warn("Не удалось проиграть сигнал", e);
                  }
              }

              /** Убирает цветовые коды, пробелы и регистр, чтобы имена сравнивались надёжно. */
              private static String norm(String s) {
                  if (s == null) return "";
                  return s.replaceAll("§.", "").trim().toLowerCase(Locale.ROOT);
              }

              private static boolean isIgnored(String name) {
                  String n = norm(name);
                  if (n.isEmpty()) return false;
                  for (String ignored : config.ignore) {
                      if (ignored != null && norm(ignored).equals(n)) return true;
                  }
                  return false;
              }

              private static void leave(Minecraft mc, String name, String profileName, UUID id, float dist) {
                  LOGGER.info("Рядом игрок name='{}' profile='{}' uuid={} dist={}, выхожу с сервера", name, profileName, id, dist);
                  enabled = false; // после возвращения мод снова выключен, чтобы не кикать в лобби
                  if (config.sound) {
                      playAlarm(mc);
                      alarmPending = true;
                  }
                  mc.getConnection().getConnection().disconnect(
                          Component.literal("AutoLeave: рядом игрок " + name
                                  + " (профиль " + profileName + ", дистанция " + (int) dist
                                  + ", в игнор-листе записей: " + config.ignore.size() + ")")
                  );
              }
          }
          EOF

      - name: Build
        working-directory: proj
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: autoleave-jar
          path: |
            proj/build/libs/autoleave-*.jar
            !proj/build/libs/*-sources.jar
            
